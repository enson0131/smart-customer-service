<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img" aria-label="从 LangGraph 导出的客服 Agent 流程"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#6880a7"/></marker></defs><rect width="680" height="550" rx="18" fill="#f3f6fb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203958"><text x="40" y="45" font-size="25" font-weight="600">原生 createAgent · LangGraph</text><text x="40" y="73" font-size="14">实线为普通边，虚线为条件边</text><path d="M340 148 L340 205" fill="none" stroke="#6880a7" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M190 332 C100 332 100 227 190 227" fill="none" stroke="#6880a7" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M340 253 L340 310" fill="none" stroke="#6880a7" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path d="M490 227 C580 227 580 437 490 437" fill="none" stroke="#6880a7" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><g><rect x="190" y="100" width="300" height="48" rx="12" fill="#fff" stroke="#c4d4ea"/><text x="340" y="121" text-anchor="middle" font-size="15">开始</text><text x="340" y="138" text-anchor="middle" font-size="11" fill="#657b96">__start__</text></g>
<g><rect x="190" y="205" width="300" height="48" rx="12" fill="#fff" stroke="#c4d4ea"/><text x="340" y="226" text-anchor="middle" font-size="15">模型与中间件</text><text x="340" y="243" text-anchor="middle" font-size="11" fill="#657b96">model_request</text></g>
<g><rect x="190" y="310" width="300" height="48" rx="12" fill="#fff" stroke="#c4d4ea"/><text x="340" y="331" text-anchor="middle" font-size="15">执行工具 · interrupt / resume</text><text x="340" y="348" text-anchor="middle" font-size="11" fill="#657b96">tools</text></g>
<g><rect x="190" y="415" width="300" height="48" rx="12" fill="#fff" stroke="#c4d4ea"/><text x="340" y="436" text-anchor="middle" font-size="15">结束</text><text x="340" y="453" text-anchor="middle" font-size="11" fill="#657b96">__end__</text></g><text x="40" y="505" font-size="14">工具缺少订单时中断，下一请求通过同一线程恢复。</text><text x="40" y="530" font-size="14">本地 SQLite 与线上 D1 保存同一结构的检查点。</text></g></svg>
