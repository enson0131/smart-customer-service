<svg xmlns="http://www.w3.org/2000/svg" width="920" height="830" viewBox="0 0 920 830" role="img" aria-labelledby="title desc">
<title id="title">AI 售后客服系统 · 分层架构</title>
<desc id="desc">从上到下依次为意图识别层、模型编排层、模型层、领域能力层和存储层。箭头表示架构层次顺序。</desc>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172c49}
.heading{font-size:26px;font-weight:650}.detail{font-size:17px;fill:#405570}
.path{font:14px Menlo,Consolas,monospace;fill:#546d8b}.num{font:600 18px Menlo,monospace;fill:#fff}
</style>
<defs><marker id="down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 9 5 0 9Z" fill="#6683a8"/></marker></defs>
<rect width="920" height="830" fill="#f3f6fa"/>
<text x="50" y="62" font-size="34" font-weight="700">AI 售后客服系统 · 分层架构</text>
<text x="51" y="98" font-size="17" fill="#546d8b">以用户意图为入口，自上而下划分五层职责</text>
<g transform="translate(50 130)">
<rect width="820" height="104" rx="14" fill="#fff" stroke="#c8d5e5"/>
<rect x="22" y="21" width="53" height="61" rx="10" fill="#28568b"/>
<text class="num" x="48" y="58" text-anchor="middle">01</text>
<text class="heading" x="98" y="43">意图识别层</text>
<text class="path" x="796" y="40" text-anchor="end">workers/intent/</text>
<text class="detail" x="98" y="76">精确单意图直达；自由输入结合任务上下文和工具观察选择动作。</text>
</g>
<path d="M460 236v23" stroke="#6683a8" stroke-width="2" marker-end="url(#down)"/>
<g transform="translate(50 266)">
<rect width="820" height="104" rx="14" fill="#fff" stroke="#c8d5e5"/>
<rect x="22" y="21" width="53" height="61" rx="10" fill="#28568b"/>
<text class="num" x="48" y="58" text-anchor="middle">02</text>
<text class="heading" x="98" y="43">模型编排层</text>
<text class="path" x="796" y="40" text-anchor="end">workers/orchestration/</text>
<text class="detail" x="98" y="76">精确指令直达，原生 createAgent 管理消息与工具循环。</text>
</g>
<path d="M460 372v23" stroke="#6683a8" stroke-width="2" marker-end="url(#down)"/>
<g transform="translate(50 402)">
<rect width="820" height="104" rx="14" fill="#fff" stroke="#c8d5e5"/>
<rect x="22" y="21" width="53" height="61" rx="10" fill="#28568b"/>
<text class="num" x="48" y="58" text-anchor="middle">03</text>
<text class="heading" x="98" y="43">模型层</text>
<text class="path" x="796" y="40" text-anchor="end">workers/model/</text>
<text class="detail" x="98" y="76">通过 LangChain 接入 DeepSeek，逐步选择工具，并基于已核实的事实组织回答。</text>
</g>
<path d="M460 508v23" stroke="#6683a8" stroke-width="2" marker-end="url(#down)"/>
<g transform="translate(50 538)">
<rect width="820" height="104" rx="14" fill="#fff" stroke="#c8d5e5"/>
<rect x="22" y="21" width="53" height="61" rx="10" fill="#28568b"/>
<text class="num" x="48" y="58" text-anchor="middle">04</text>
<text class="heading" x="98" y="43">领域能力层</text>
<text class="path" x="796" y="40" text-anchor="end">workers/domain/</text>
<text class="detail" x="98" y="76">政策检索、模拟履约与物流轨迹、签收回执、退款资格与预览。</text>
</g>
<path d="M460 644v23" stroke="#6683a8" stroke-width="2" marker-end="url(#down)"/>
<g transform="translate(50 674)">
<rect width="820" height="104" rx="14" fill="#fff" stroke="#c8d5e5"/>
<rect x="22" y="21" width="53" height="61" rx="10" fill="#28568b"/>
<text class="num" x="48" y="58" text-anchor="middle">05</text>
<text class="heading" x="98" y="43">存储层</text>
<text class="path" x="796" y="40" text-anchor="end">workers/storage/</text>
<text class="detail" x="98" y="76">本地 SQLite、线上 D1 保存检查点、会话、订单及模拟退款。</text>
</g>
<text x="51" y="808" font-size="14" fill="#546d8b">箭头表示层次顺序。单次请求由编排层按需调度模型和领域能力。</text>
</svg>
